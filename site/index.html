<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fbf6ef">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="HelloSupper">
  <title>HelloSupper</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <div>
        <h1 id="app-title">HelloSupper</h1>
        <p class="sub" id="week-label">Loading...</p>
      </div>
    </div>
    <select id="week-select" class="week-select" aria-label="Choose week" hidden></select>
  </header>

  <main id="view" tabindex="-1" aria-live="polite"></main>

  <section id="sheet" class="sheet" hidden aria-modal="true" role="dialog" aria-labelledby="sheet-title"></section>

  <nav class="tabbar" aria-label="Sections">
    <a href="#week" data-tab="week"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11h16M4 7h16v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7Zm4-3v4m8-4v4"/></svg><span>This week</span></a>
    <a href="#vote" data-tab="vote"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 11v9H4v-9h3Zm0 0 4-7c1.5 0 2.5 1 2 3l-1 3h6a2 2 0 0 1 2 2.3l-1.2 6A2 2 0 0 1 16.8 20H7"/></svg><span>Vote</span></a>
    <a href="#library" data-tab="library"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4v16H5zM11 4h4v16h-4zM17.5 5l3 .8-3.7 14.4-3-.8z"/></svg><span>Library</span></a>
    <a href="#shopping" data-tab="shopping"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.4 11h10.2L20 7H6.2M9 20a1 1 0 1 0 0-2 1 1 0 0 0 0 2Zm8 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"/></svg><span>Shopping</span></a>
  </nav>
  <noscript><p class="empty">HelloSupper needs JavaScript switched on.</p></noscript>
</body>
</html>
